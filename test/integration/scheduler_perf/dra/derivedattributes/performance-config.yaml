# Pair physical matchAttribute (DRADerivedAttributes off, the alpha default)
# with the same match expressed as a derived attribute (gate on, the beta
# default). The two schedules allocate the same devices; the gap is the cost
# of evaluating derived attributes.
#
# match_*_compare is the smaller steady-state pair (performance+short).
# match_physical_500nodes / match_empty_500nodes is the same pair at the
# scale used by ci-benchmark-scheduler-perf.
- name: SchedulingWithResourceClaimTemplate
  featureGates:
    DRADerivedAttributes: true
  workloadTemplate:
  - opcode: createNodes
    countParam: $nodesWithoutDRA
  - opcode: createNodes
    nodeTemplatePath: ../templates/node-with-dra-test-driver.yaml
    countParam: $nodesWithDRA
  - opcode: createAny
    templatePath: ../templates/resourceslice-basic-devices.yaml
    countParam: $nodesWithDRA
    templateParams:
      numPCIRoots: $numPCIRoots|2
      numDevices: 10
  - opcode: createAny
    templatePath: ../templates/deviceclass.yaml
  - opcode: createAny
    templatePath: ../templates/resourceclaim.yaml
    countParam: $initClaims
    namespace: init
  - opcode: allocResourceClaims
    namespace: init
  - opcode: createAny
    templatePath: ../templates/resourceclaimtemplate.yaml
    namespace: test
    templateParams:
      numRequests: $numRequests|1
      selectors: $selectors|
      constraints: $constraints|
      derivedAttributes: $derivedAttributes|
  - opcode: createPods
    namespace: test
    countParam: $measurePods
    steadyStateParam: $steadyState
    durationParam: $duration
    podTemplatePath: ../templates/pod-with-claim-template.yaml
    collectMetrics: true
  workloads:
  - name: match_fast
    labels: [integration-test, short]
    params:
      nodesWithDRA: 1
      nodesWithoutDRA: 1
      initClaims: 0
      measurePods: 2
      steadyState: false
      duration: 0s # unused
      numRequests: 5
      numPCIRoots: 2
      constraints:
      - matchAttribute: test-driver.cdi.k8s.io/derivedPciRoot
      derivedAttributes:
      - name: test-driver.cdi.k8s.io/derivedPciRoot
        expression: device.attributes["resource.kubernetes.io"].pciRoot
  - name: match_physical_compare
    # Gate off: same pciRoot match, no derived attribute CEL.
    featureGates:
      DRADerivedAttributes: false
    labels: [performance, short]
    params:
      nodesWithDRA: 20
      nodesWithoutDRA: 0
      initClaims: 0
      measurePods: 10
      steadyState: true
      duration: 10s
      numRequests: 5
      numPCIRoots: 2
      constraints:
      - matchAttribute: resource.kubernetes.io/pciRoot
  - name: match_derived_compare
    labels: [performance, short]
    params:
      nodesWithDRA: 20
      nodesWithoutDRA: 0
      initClaims: 0
      measurePods: 10
      steadyState: true
      duration: 10s
      numRequests: 5
      numPCIRoots: 2
      constraints:
      - matchAttribute: test-driver.cdi.k8s.io/derivedPciRoot
      derivedAttributes:
      - name: test-driver.cdi.k8s.io/derivedPciRoot
        expression: device.attributes["resource.kubernetes.io"].pciRoot
  - name: match_physical_500nodes
    featureGates:
      DRADerivedAttributes: false
    labels: [performance]
    params:
      nodesWithDRA: 500
      nodesWithoutDRA: 0
      initClaims: 0
      measurePods: 10
      steadyState: true
      duration: 10s
      numRequests: 5
      numPCIRoots: 2
      constraints:
      - matchAttribute: resource.kubernetes.io/pciRoot
  - name: match_empty_500nodes
    labels: [performance]
    params:
      nodesWithDRA: 500
      nodesWithoutDRA: 0
      initClaims: 0
      measurePods: 10
      steadyState: true
      duration: 10s
      numRequests: 5
      numPCIRoots: 2
      constraints:
      - matchAttribute: test-driver.cdi.k8s.io/derivedPciRoot
      derivedAttributes:
      - name: test-driver.cdi.k8s.io/derivedPciRoot
        expression: device.attributes["resource.kubernetes.io"].pciRoot
